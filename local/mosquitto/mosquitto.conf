# Mosquitto config for local development.
# Anonymous access is acceptable ONLY because the port is bound to 127.0.0.1.
# The real AWS deployment uses X.509 certificates on AWS IoT Core.
listener 1883 0.0.0.0
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
